<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Add Suspect</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6f9;
        }

        .sidebar {
            position: fixed;
            width: 240px;
            height: 100vh;
            background: #111827;
            padding: 20px 0;
        }

        .sidebar h2 {
            color: white;
            text-align: center;
            margin-bottom: 25px;
        }

        .sidebar a {
            display: block;
            padding: 13px 22px;
            color: #d1d5db;
            text-decoration: none;
        }

        .sidebar a:hover,
        .sidebar a.active {
            background: #2563eb;
            color: white;
        }

        .main {
            margin-left: 240px;
            padding: 35px;
        }

        .box {
            background: white;
            max-width: 800px;
            padding: 30px;
            border-radius: 12px;
        }

        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 11px;
            border: 1px solid #ddd;
            border-radius: 7px;
        }

        button,
        .back {
            padding: 11px 18px;
            border: none;
            border-radius: 7px;
            text-decoration: none;
        }

        button {
            background: #2563eb;
            color: white;
        }

        .back {
            background: #6b7280;
            color: white;
            margin-left: 8px;
        }

    </style>

</head>

<body>

<div class="sidebar">

    <h2>🔐 Crime Record</h2>

    <a href="/dashboard">🏠 Dashboard</a>
    <a href="/add-crime">➕ Add Crime</a>
    <a href="/crime-records">📋 Crime Records</a>
    <a href="/suspects">👤 Suspects</a>
    <a href="/add-suspect" class="active">➕ Add Suspect</a>
    <a href="/investigation">🔍 Investigation</a>
    <a href="/add-investigation">➕ Add Investigation</a>
    <a href="/victim-witness">👥 Victim / Witness</a>
    <a href="/add-victim-witness">➕ Add Victim / Witness</a>
    <a href="/reports">📊 Reports</a>
    <a href="/logout">🚪 Logout</a>

</div>

<div class="main">

    <div class="box">

        <h1>➕ Add Suspect</h1>

        <br>

        <form action="/save-suspect" method="post">

            <div class="row">

                <div class="group">
                    <label>Suspect ID</label>
                    <input type="text"
                           name="suspectId"
                           required>
                </div>

                <div class="group">
                    <label>Suspect Name</label>
                    <input type="text"
                           name="suspectName"
                           required>
                </div>

                <div class="group">
                    <label>Case ID</label>
                    <input type="text"
                           name="caseId"
                           required>
                </div>

                <div class="group">
                    <label>Crime Type</label>
                    <input type="text"
                           name="crimeType">
                </div>

                <div class="group">
                    <label>Location</label>
                    <input type="text"
                           name="location">
                </div>

                <div class="group">

                    <label>Status</label>

                    <select name="status">

                        <option value="Wanted">
                            Wanted
                        </option>

                        <option value="Arrested">
                            Arrested
                        </option>

                        <option value="Under Investigation">
                            Under Investigation
                        </option>

                    </select>

                </div>

            </div>

            <button type="submit">
                Save Suspect
            </button>

            <a href="/suspects" class="back">
                Back
            </a>

        </form>

    </div>

</div>

</body>
</html>
