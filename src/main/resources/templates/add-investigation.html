<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Add Investigation</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6f9;
        }

        .sidebar {
            position: fixed;
            width: 240px;
            height: 100vh;
            background: #111827;
            padding: 20px 0;
        }

        .sidebar h2 {
            color: white;
            text-align: center;
            margin-bottom: 25px;
        }

        .sidebar a {
            display: block;
            padding: 13px 22px;
            color: #d1d5db;
            text-decoration: none;
        }

        .sidebar a:hover,
        .sidebar a.active {
            background: #2563eb;
            color: white;
        }

        .main {
            margin-left: 240px;
            padding: 35px;
        }

        .box {
            background: white;
            max-width: 850px;
            padding: 30px;
            border-radius: 12px;
        }

        .group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 11px;
            border: 1px solid #ddd;
            border-radius: 7px;
        }

        textarea {
            height: 100px;
        }

        button,
        .back {
            padding: 11px 18px;
            border: none;
            border-radius: 7px;
            text-decoration: none;
        }

        button {
            background: #2563eb;
            color: white;
        }

        .back {
            background: #6b7280;
            color: white;
            margin-left: 8px;
        }

    </style>

</head>

<body>

<div class="sidebar">

    <h2>🔐 Crime Record</h2>

    <a href="/dashboard">🏠 Dashboard</a>
    <a href="/add-crime">➕ Add Crime</a>
    <a href="/crime-records">📋 Crime Records</a>
    <a href="/suspects">👤 Suspects</a>
    <a href="/add-suspect">➕ Add Suspect</a>
    <a href="/investigation">🔍 Investigation</a>
    <a href="/add-investigation" class="active">
        ➕ Add Investigation
    </a>
    <a href="/victim-witness">👥 Victim / Witness</a>
    <a href="/add-victim-witness">
        ➕ Add Victim / Witness
    </a>
    <a href="/reports">📊 Reports</a>
    <a href="/logout">🚪 Logout</a>

</div>

<div class="main">

    <div class="box">

        <h1>➕ Add Investigation</h1>

        <br>

        <form action="/save-investigation"
              method="post">

            <div class="group">
                <label>Investigation ID</label>
                <input type="text"
                       name="investigationId"
                       required>
            </div>

            <div class="group">
                <label>Case ID</label>
                <input type="text"
                       name="caseId"
                       required>
            </div>

            <div class="group">
                <label>Officer Name</label>
                <input type="text"
                       name="officerName"
                       required>
            </div>

            <div class="group">
                <label>Investigation Date</label>
                <input type="date"
                       name="investigationDate">
            </div>

            <div class="group">
                <label>Investigation Details</label>
                <textarea name="investigationDetails"></textarea>
            </div>

            <div class="group">
                <label>Evidence</label>
                <textarea name="evidence"></textarea>
            </div>

            <div class="group">

                <label>Status</label>

                <select name="status">

                    <option value="Pending">
                        Pending
                    </option>

                    <option value="In Progress">
                        In Progress
                    </option>

                    <option value="Completed">
                        Completed
                    </option>

                </select>

            </div>

            <button type="submit">
                Save Investigation
            </button>

            <a href="/investigation"
               class="back">
                Back
            </a>

        </form>

    </div>

</div>

</body>
</html>
