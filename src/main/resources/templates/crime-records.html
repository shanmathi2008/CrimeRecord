<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Crime Records</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6f9;
        }

        .sidebar {
            position: fixed;
            width: 240px;
            height: 100vh;
            background: #111827;
            padding: 20px 0;
        }

        .sidebar h2 {
            color: white;
            text-align: center;
            margin-bottom: 25px;
        }

        .sidebar a {
            display: block;
            color: #d1d5db;
            text-decoration: none;
            padding: 13px 22px;
        }

        .sidebar a:hover,
        .sidebar a.active {
            background: #2563eb;
            color: white;
        }

        .main {
            margin-left: 240px;
            padding: 35px;
        }

        .box {
            background: white;
            padding: 25px;
            border-radius: 12px;
        }

        .top {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        input {
            padding: 11px;
            width: 300px;
            border: 1px solid #ddd;
            border-radius: 7px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #111827;
            color: white;
            padding: 12px;
            text-align: left;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
        }

        a.case {
            color: #2563eb;
            font-weight: bold;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="sidebar">

    <h2>🔐 Crime Record</h2>

    <a href="/dashboard">🏠 Dashboard</a>
    <a href="/add-crime">➕ Add Crime</a>
    <a href="/crime-records" class="active">📋 Crime Records</a>
    <a href="/suspects">👤 Suspects</a>
    <a href="/add-suspect">➕ Add Suspect</a>
    <a href="/investigation">🔍 Investigation</a>
    <a href="/add-investigation">➕ Add Investigation</a>
    <a href="/victim-witness">👥 Victim / Witness</a>
    <a href="/add-victim-witness">➕ Add Victim / Witness</a>

    <a href="/reports">📊 Reports</a>

    <a href="/logout">🚪 Logout</a>

</div>

<div class="main">

    <div class="box">

        <div class="top">

            <h1>📋 Crime Records</h1>

            <input type="text"
                   id="search"
                   placeholder="Search records..."
                   onkeyup="searchTable()">

        </div>

        <table id="crimeTable">

            <thead>

            <tr>
                <th>Case ID</th>
                <th>Crime Type</th>
                <th>Date</th>
                <th>Location</th>
                <th>Victim</th>
                <th>Suspect</th>
                <th>Officer</th>
                <th>Status</th>
            </tr>

            </thead>

            <tbody>

            <tr th:each="crime : ${crimes}">

                <td>
                    <a class="case"
                       th:href="@{/case-details/{id}(id=${crime.caseId})}"
                       th:text="${crime.caseId}">
                    </a>
                </td>

                <td th:text="${crime.crimeType}"></td>
                <td th:text="${crime.crimeDate}"></td>
                <td th:text="${crime.location}"></td>
                <td th:text="${crime.victimName}"></td>
                <td th:text="${crime.suspectName}"></td>
                <td th:text="${crime.officerName}"></td>
                <td th:text="${crime.caseStatus}"></td>

            </tr>

            </tbody>

        </table>

    </div>

</div>

<script>

function searchTable() {

    let input =
        document.getElementById("search")
        .value.toLowerCase();

    let rows =
        document.querySelectorAll("#crimeTable tbody tr");

    rows.forEach(row => {

        row.style.display =
            row.innerText.toLowerCase().includes(input)
                ? ""
                : "none";

    });
}

</script>

</body>
</html>
